networks:
  1panel-network:
    external: true
services:
  app_name:
    container_name: ech0
    env_file:
    - ./envs/global.env
    - .env
    environment:
    - TZ=Asia/Shanghai
    - ECH0_SERVER_PORT=6277
    - ECH0_SERVER_HOST=0.0.0.0
    - ECH0_SERVER_MODE=release
    - HTTP_PROXY=${HTTP_PROXY:-}
    - HTTPS_PROXY=${HTTP_PROXY:-}
    - NO_PROXY=localhost,127.0.0.1,::1
    image: sn0wl1n/ech0:v5.9.8
    labels:
      createdBy: Apps
    networks:
    - 1panel-network
    ports:
    - ${PANEL_APP_PORT_HTTP}:6277
    restart: always
    volumes:
    - ${ECH0_ROOT_PATH}/data:/app/data
    - ${ECH0_ROOT_PATH}/backup:/app/backup
