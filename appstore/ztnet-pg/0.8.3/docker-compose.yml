networks:
  1panel-network:
    external: true
services:
  ztnet:
    container_name: ztnet-pg
    depends_on:
    - ztnet-postgres
    env_file:
    - ./envs/global.env
    - .env
    environment:
    - TZ=Asia/Shanghai
    - POSTGRES_HOST=ztnet-postgres
    - POSTGRES_PORT=5432
    - POSTGRES_USER=postgres
    - POSTGRES_PASSWORD=postgres
    - POSTGRES_DB=ztnet
    - NEXTAUTH_URL_INTERNAL=http://ztnet:3000
    image: sinamics/ztnet:0.8.3
    labels:
      createdBy: Apps
    networks:
    - 1panel-network
    ports:
    - ${PANEL_APP_PORT_HTTP}:3000
    restart: always
  ztnet-postgres:
    container_name: postgres-ztnet-pg
    environment:
      POSTGRES_DB: ztnet
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    expose:
    - 5432
    image: postgres:16.14
    networks:
    - 1panel-network
    restart: always
    volumes:
    - ${ZTNET_ROOT_PATH}/postgres:/var/lib/postgresql/data
