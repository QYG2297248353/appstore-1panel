additionalProperties:
  formFields:
    - default: "/home/immich-machine-learning"
      edit: true
      envKey: IMMICH_ROOT_PATH
      labelZh: 数据持久化路径
      labelEn: Data persistence path
      required: true
      type: text
    - default: 3003
      edit: true
      envKey: PANEL_APP_PORT_HTTP
      labelZh: API 端口
      labelEn: API port
      required: true
      rule: paramPort
      type: number
    - default: "https://hf-mirror.com"
      edit: true
      envKey: HF_ENDPOINT
      labelZh: Hugging Face 加速服务地址
      labelEn: Hugging Face Endpoint
      required: false
      type: text
    - default: "main"
      edit: true
      envKey: MACHINE_LEARNING_MODEL_REVISION
      labelZh: 机器学习模型版本
      labelEn: Machine Learning Model Revision
      required: false
      type: select
      values:
        - label: 原始导出版本
          value: "main"
        - label: 较新导出版本
          value: "v2"
