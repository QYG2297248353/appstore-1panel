networks:
  1panel-network:
    external: true
  keygate-network:
    driver: bridge
services:
  keygate:
    container_name: keygate-all-in-one
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
    - ./envs/global.env
    - .env
    environment:
    - PORT=9000
    - ENVIRONMENT=production
    - BASE_URL=${BASE_URL}
    - DATABASE_URL=postgres://keygate:${POSTGRES_PASSWORD}@postgres:5432/keygate?sslmode=disable
    - REDIS_URL=redis://redis:6379/0
    - JWT_SECRET=${JWT_SECRET}
    - LICENSE_SIGNING_KEY=${LICENSE_SIGNING_KEY}
    - ADMIN_EMAILS=${ADMIN_EMAILS}
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 10s
      test:
      - CMD
      - curl
      - -sf
      - http://localhost:9000/health
      timeout: 5s
    image: ghcr.io/tabloy/keygate:0.1.15
    labels:
      createdBy: Apps
    networks:
    - 1panel-network
    - keygate-network
    ports:
    - ${PANEL_APP_PORT_HTTP}:9000
    restart: always
  postgres:
    container_name: keygate-all-in-one-postgres
    env_file:
    - ./envs/global.env
    - .env
    environment:
      POSTGRES_DB: keygate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: keygate
    healthcheck:
      interval: 10s
      retries: 5
      test:
      - CMD-SHELL
      - pg_isready -U keygate
      timeout: 5s
    image: postgres:18-alpine
    networks:
    - keygate-network
    restart: always
    volumes:
    - ${KEYGATE_ROOT_PATH}/postgres:/var/lib/postgresql
  redis:
    command: redis-server --appendonly yes
    container_name: keygate-all-in-one-redis
    env_file:
    - ./envs/global.env
    - .env
    healthcheck:
      interval: 10s
      retries: 5
      test:
      - CMD
      - redis-cli
      - ping
      timeout: 5s
    image: redis:7-alpine
    networks:
    - keygate-network
    restart: always
    volumes:
    - ${KEYGATE_ROOT_PATH}/redis:/data
