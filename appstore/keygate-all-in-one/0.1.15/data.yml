additionalProperties:
  formFields:
    - default: "/home/keygate"
      edit: true
      envKey: KEYGATE_ROOT_PATH
      labelZh: 数据持久化路径
      labelEn: Data persistence path
      required: true
      type: text
    - default: 9000
      edit: true
      envKey: PANEL_APP_PORT_HTTP
      labelZh: WebUI 端口
      labelEn: WebUI port
      required: true
      rule: paramPort
      type: number
    - default: "http://127.0.0.1:9000"
      edit: true
      envKey: BASE_URL
      labelZh: 服务外部地址
      labelEn: Service external address
      required: true
      type: text
    - default: ""
      edit: true
      envKey: POSTGRES_PASSWORD
      labelZh: 数据库 密码
      labelEn: Database Password
      random: true
      required: true
      rule: paramComplexity
      type: password
    - default: ""
      edit: true
      envKey: JWT_SECRET
      labelZh: JWT 密钥
      labelEn: JWT Secret
      random: true
      required: true
      rule: paramComplexity
      type: password
    - default: ""
      edit: true
      envKey: LICENSE_SIGNING_KEY
      labelZh: 许可证签名密钥
      labelEn: License Signing Key
      random: true
      required: true
      rule: paramComplexity
      type: password
    - default: ""
      edit: true
      envKey: ADMIN_EMAILS
      labelZh: 管理员邮箱 (逗号分隔)
      labelEn: Admin Emails (comma separated)
      required: false
      type: text
