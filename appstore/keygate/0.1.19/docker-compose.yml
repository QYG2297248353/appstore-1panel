networks:
  1panel-network:
    external: true
services:
  keygate:
    container_name: keygate
    env_file:
    - ./envs/global.env
    - .env
    environment:
    - PORT=9000
    - ENVIRONMENT=production
    - BASE_URL=${BASE_URL}
    - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_NAME}?sslmode=disable
    - REDIS_URL=${REDIS_URL}
    - JWT_SECRET=${JWT_SECRET}
    - LICENSE_SIGNING_KEY=${LICENSE_SIGNING_KEY}
    - RELEASE_KEY_ENCRYPTION_KEY=${RELEASE_KEY_ENCRYPTION_KEY}
    - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
    - SMTP_HOST=${SMTP_HOST}
    - SMTP_PORT=${SMTP_PORT}
    - SMTP_USERNAME=${SMTP_USERNAME}
    - SMTP_PASSWORD=${SMTP_PASSWORD}
    - SMTP_FROM=${SMTP_FROM}
    - ADMIN_EMAILS=${ADMIN_EMAILS}
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 10s
      test:
      - CMD
      - curl
      - -sf
      - http://localhost:9000/health
      timeout: 5s
    image: ghcr.io/tabloy/keygate:0.1.19
    labels:
      createdBy: Apps
    networks:
    - 1panel-network
    ports:
    - ${PANEL_APP_PORT_HTTP}:9000
    restart: always
