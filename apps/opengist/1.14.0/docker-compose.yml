networks:
  1panel-network:
    external: true

services:
  opengist:
    image: thomiceli/opengist:1.14.0
    container_name: ${CONTAINER_NAME}
    labels:
      createdBy: "Apps"
    restart: always
    networks:
      - 1panel-network
    ports:
      - ${PANEL_APP_PORT_HTTP}:6157
    env_file:
      - ${GLOBAL_ENV_FILE:-/etc/1panel/envs/global.env}
      - ${ENV_FILE:-/etc/1panel/envs/default.env}
    volumes:
      - ${OPENGIST_ROOT_PATH}/.opengist:/opengist
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6157/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      - TZ=Asia/Shanghai
      - OG_SQLITE_JOURNAL_MODE=WAL
      - OG_HTTP_HOST=0.0.0.0
      - OG_HTTP_PORT=6157
      - OG_SSH_HOST=0.0.0.0
      - OG_SSH_PORT=2222
