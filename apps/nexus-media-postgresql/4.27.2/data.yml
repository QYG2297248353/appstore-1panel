additionalProperties:
  formFields:
    - child:
        default: ""
        envKey: PANEL_POSTGRES_SERVICE
        required: true
        type: service
      default: postgresql
      envKey: PANEL_POSTGRES_TYPE
      labelZh: Postgres 服务 (前置检查)
      labelEn: Postgres Service (Pre-check)
      required: true
      type: apps
      values:
        - label: PostgreSQL
          value: postgresql
    - default: "/home/nexus-media"
      edit: true
      envKey: NEXUS_MEDIA_ROOT_PATH
      labelZh: 数据持久化路径
      labelEn: Data persistence path
      required: true
      type: text
    - default: "/home/nexus-media/media"
      edit: true
      envKey: NEXUS_MEDIA_MEDIA_PATH
      labelZh: 媒体库路径
      labelEn: Media library path
      required: true
      type: text
    - default: 8080
      edit: true
      envKey: PANEL_APP_PORT_HTTP
      labelZh: WebUI 端口
      labelEn: WebUI port
      required: true
      rule: paramPort
      type: number
    - default: 3000
      edit: true
      envKey: PANEL_APP_PORT_API
      labelZh: 后端 API 端口
      labelEn: Backend API port
      required: true
      rule: paramPort
      type: number
    - default: "0"
      edit: true
      envKey: PUID
      labelZh: 运行用户 UID
      labelEn: Run user UID
      required: true
      type: text
    - default: "0"
      edit: true
      envKey: PGID
      labelZh: 运行用户 GID
      labelEn: Run user GID
      required: true
      type: text
    - default: "127.0.0.1"
      edit: true
      envKey: DB_HOSTNAME
      labelZh: 数据库 主机地址
      labelEn: Database Host
      required: true
      type: text
    - default: 5432
      edit: true
      envKey: DB_PORT
      labelZh: 数据库 端口
      labelEn: Database Port
      required: true
      rule: paramPort
      type: number
    - default: "nexus_media"
      edit: true
      envKey: DB_USERNAME
      labelZh: 数据库 用户名
      labelEn: Database User
      required: true
      type: text
    - default: ""
      edit: true
      envKey: DB_PASSWORD
      labelZh: 数据库 密码
      labelEn: Database Password
      random: true
      required: true
      rule: paramComplexity
      type: password
    - default: "nexus_media"
      edit: true
      envKey: DB_DATABASE_NAME
      labelZh: 数据库 名称
      labelEn: Database Name
      required: true
      type: text
