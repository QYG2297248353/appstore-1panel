networks:
  1panel-network:
    external: true

services:
  deeplx:
    image: qyg2297248353/deeplx:v0.9.8.3
    container_name: ${CONTAINER_NAME}
    labels:
      createdBy: "Apps"
    restart: always
    networks:
      - 1panel-network
    ports:
      - ${PANEL_APP_PORT_HTTP}:1188
    environment:
      - PORT=1188
