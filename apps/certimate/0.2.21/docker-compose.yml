networks:
  1panel-network:
    external: true

services:
  certimate:
    image: usual2970/certimate:v0.2.21
    container_name: ${CONTAINER_NAME}
    labels:
      createdBy: "Apps"
    restart: always
    networks:
      - 1panel-network
    ports:
      - ${PANEL_APP_PORT_HTTP}:8090
    volumes:
      - ${CERTIMATE_ROOT_PATH}/data:/app/pb_data
