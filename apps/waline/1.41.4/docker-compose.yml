networks:
  1panel-network:
    external: true

services:
  waline:
    image: lizheming/waline:1.41.4
    container_name: ${CONTAINER_NAME}
    labels:
      createdBy: "Apps"
    restart: always
    networks:
      - 1panel-network
    ports:
      - ${PANEL_APP_PORT_HTTP}:8360
    env_file:
      - ${GLOBAL_ENV_FILE:-/etc/1panel/envs/global.env}
      - ${ENV_FILE:-/etc/1panel/envs/default.env}
    volumes:
      - ${WALINE_ROOT_PATH}/data:/app/data
    environment:
      - TZ=Asia/Shanghai
      - SQLITE_PATH=/app/data
      - SQLITE_DB=waline
      - SQLITE_PREFIX=wl_
