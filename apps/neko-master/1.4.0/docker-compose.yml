networks:
  1panel-network:
    external: true

services:
  neko-master:
    image: foru17/neko-master:1.4.0
    container_name: ${CONTAINER_NAME}
    labels:
      createdBy: "Apps"
    restart: always
    networks:
      - 1panel-network
    ports:
      - ${PANEL_APP_PORT_HTTP}:3000
      - ${PANEL_APP_PORT_WS}:3002
    env_file:
      - ${GLOBAL_ENV_FILE:-/etc/1panel/envs/global.env}
      - ${ENV_FILE:-/etc/1panel/envs/default.env}
    volumes:
      - ${NEKO_MASTER_ROOT_PATH}/data:/app/data
    environment:
      - TZ=Asia/Shanghai
      - NODE_ENV=production
      - DB_PATH=/app/data/stats.db
