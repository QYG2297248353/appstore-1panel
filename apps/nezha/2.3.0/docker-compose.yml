networks:
  1panel-network:
    external: true

services:
  nezha:
    image: ghcr.io/nezhahq/nezha:v2.3.0
    container_name: ${CONTAINER_NAME}
    labels:
      createdBy: "Apps"
    restart: always
    networks:
      - 1panel-network
    ports:
      - ${PANEL_APP_PORT_HTTP}:8008
    volumes:
      - ${NEZHA_ROOT_PATH}/data:/dashboard/data
    environment:
      - TZ=Asia/Shanghai
