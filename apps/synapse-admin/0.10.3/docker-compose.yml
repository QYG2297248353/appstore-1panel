networks:
  1panel-network:
    external: true

services:
  synapse-admin:
    image: awesometechnologies/synapse-admin:0.10.3
    container_name: ${CONTAINER_NAME}
    labels:
      createdBy: "Apps"
    restart: always
    networks:
      - 1panel-network
    ports:
      - ${PANEL_APP_PORT_HTTP}:80
