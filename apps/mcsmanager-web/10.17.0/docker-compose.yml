networks:
  1panel-network:
    external: true

services:
  mcsmanager-web:
    image: githubyumao/mcsmanager-web:v10.17.0
    container_name: ${CONTAINER_NAME}
    restart: always
    networks:
      - 1panel-network
    ports:
      - ${PANEL_APP_PORT_HTTP}:23333
    env_file:
      - ${GLOBAL_ENV_FILE:-/etc/1panel/envs/global.env}
      - ${ENV_FILE:-/etc/1panel/envs/default.env}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${MCSMANAGER_ROOT_PATH}/web/data:/opt/mcsmanager/web/data
      - ${MCSMANAGER_ROOT_PATH}/web/logs:/opt/mcsmanager/web/logs
    environment:
      - TZ=Asia/Shanghai
