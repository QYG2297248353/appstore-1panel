networks:
  1panel-network:
    external: true

services:
  mcsmanager-daemon:
    image: githubyumao/mcsmanager-daemon:v10.17.0
    container_name: ${CONTAINER_NAME}
    labels:
      createdBy: "Apps"
    restart: always
    networks:
      - 1panel-network
    ports:
      - ${PANEL_APP_PORT_API}:24444
    env_file:
      - ${GLOBAL_ENV_FILE:-/etc/1panel/envs/global.env}
      - ${ENV_FILE:-/etc/1panel/envs/default.env}
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ${MCSMANAGER_ROOT_PATH}/daemon/data:/opt/mcsmanager/daemon/data
      - ${MCSMANAGER_ROOT_PATH}/daemon/logs:/opt/mcsmanager/daemon/logs
    environment:
      - TZ=Asia/Shanghai

  mcsmanager-web:
    image: githubyumao/mcsmanager-web:v10.17.0
    depends_on:
      - mcsmanager-daemon
    container_name: web-${CONTAINER_NAME}
    restart: always
    networks:
      - 1panel-network
    ports:
      - ${PANEL_APP_PORT_HTTP}:23333
    env_file:
      - ${GLOBAL_ENV_FILE:-/etc/1panel/envs/global.env}
      - ${ENV_FILE:-/etc/1panel/envs/default.env}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${MCSMANAGER_ROOT_PATH}/web/data:/opt/mcsmanager/web/data
      - ${MCSMANAGER_ROOT_PATH}/web/logs:/opt/mcsmanager/web/logs
      - ${MCSMANAGER_ROOT_PATH}/daemon:/opt/mcsmanager/daemon
    environment:
      - TZ=Asia/Shanghai
