networks:
  1panel-network:
    external: true

services:
  limesurvey:
    image: martialblog/limesurvey:6.6.5-240924-apache
    container_name: ${CONTAINER_NAME}
    labels:
      createdBy: "Apps"
    restart: always
    networks:
      - 1panel-network
    ports:
      - ${PANEL_APP_PORT_HTTP}:8080
    volumes:
      - ${LIMESURVEY_ROOT_PATH}/surveys:/var/www/html/upload/surveys
    environment:
      - LISTEN_PORT=8080
      - PUBLIC_URL=foobar.com
