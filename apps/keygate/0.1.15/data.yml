additionalProperties:
  formFields:
    - child:
        default: ""
        envKey: PANEL_POSTGRES_SERVICE
        required: true
        type: service
      default: postgresql
      envKey: PANEL_POSTGRES_TYPE
      labelZh: Postgres 服务 (前置检查)
      labelEn: Postgres Service (Pre-check)
      required: true
      type: apps
      values:
        - label: PostgreSQL
          value: postgresql
    - child:
        default: ""
        envKey: PANEL_REDIS_SERVICE
        required: true
        type: service
      default: redis
      envKey: PANEL_REDIS_TYPE
      labelZh: Redis 服务 (前置检查)
      labelEn: Redis Service (Pre-check)
      required: true
      type: apps
      values:
        - label: Redis
          value: redis
    - default: 9000
      edit: true
      envKey: PANEL_APP_PORT_HTTP
      labelZh: WebUI 端口
      labelEn: WebUI port
      required: true
      rule: paramPort
      type: number
    - default: "http://127.0.0.1:9000"
      edit: true
      envKey: BASE_URL
      labelZh: 服务外部地址
      labelEn: Service external address
      required: true
      type: text
    - default: "127.0.0.1"
      edit: true
      envKey: POSTGRES_HOST
      labelZh: 数据库 主机地址
      labelEn: Database Host
      required: true
      type: text
    - default: 5432
      edit: true
      envKey: POSTGRES_PORT
      labelZh: 数据库 端口
      labelEn: Database Port
      required: true
      rule: paramPort
      type: number
    - default: "keygate"
      edit: true
      envKey: POSTGRES_NAME
      labelZh: 数据库 名称
      labelEn: Database Name
      required: true
      rule: paramCommon
      type: text
    - default: "keygate"
      edit: true
      envKey: POSTGRES_USER
      labelZh: 数据库 用户名
      labelEn: Database Username
      required: true
      type: text
    - default: ""
      edit: true
      envKey: POSTGRES_PASSWORD
      labelZh: 数据库 密码
      labelEn: Database Password
      random: true
      required: true
      rule: paramComplexity
      type: password
    - default: "redis://127.0.0.1:6379/0"
      edit: true
      envKey: REDIS_URL
      labelZh: Redis 连接地址
      labelEn: Redis URL
      required: true
      type: text
    - default: ""
      edit: true
      envKey: JWT_SECRET
      labelZh: JWT 密钥
      labelEn: JWT Secret
      random: true
      required: true
      rule: paramComplexity
      type: password
    - default: ""
      edit: true
      envKey: LICENSE_SIGNING_KEY
      labelZh: 许可证签名密钥
      labelEn: License Signing Key
      random: true
      required: true
      rule: paramComplexity
      type: password
    - default: ""
      edit: true
      envKey: RELEASE_KEY_ENCRYPTION_KEY
      labelZh: 发布密钥加密密钥 (推荐)
      labelEn: Release Key Encryption Key (Recommended)
      random: true
      required: false
      rule: paramComplexity
      type: password
    - default: ""
      edit: true
      envKey: STRIPE_SECRET_KEY
      labelZh: Stripe 密钥 (可选)
      labelEn: Stripe Secret Key (Optional)
      required: false
      type: password
    - default: ""
      edit: true
      envKey: SMTP_HOST
      labelZh: SMTP 主机 (可选)
      labelEn: SMTP Host (Optional)
      required: false
      type: text
    - default: 587
      edit: true
      envKey: SMTP_PORT
      labelZh: SMTP 端口
      labelEn: SMTP Port
      required: true
      rule: paramPort
      type: number
    - default: ""
      edit: true
      envKey: SMTP_USERNAME
      labelZh: SMTP 用户名 (可选)
      labelEn: SMTP Username (Optional)
      required: false
      type: text
    - default: ""
      edit: true
      envKey: SMTP_PASSWORD
      labelZh: SMTP 密码 (可选)
      labelEn: SMTP Password (Optional)
      required: false
      type: password
    - default: ""
      edit: true
      envKey: SMTP_FROM
      labelZh: SMTP 发件人 (可选)
      labelEn: SMTP From (Optional)
      required: false
      type: text
    - default: ""
      edit: true
      envKey: ADMIN_EMAILS
      labelZh: 管理员邮箱 (逗号分隔)
      labelEn: Admin Emails (comma separated)
      required: false
      type: text
