networks:
  1panel-network:
    external: true

services:
  twikoo:
    image: imaegoo/twikoo:1.7.15
    container_name: ${CONTAINER_NAME}
    labels:
      createdBy: "Apps"
    restart: always
    networks:
      - 1panel-network
    ports:
      - ${PANEL_APP_PORT_HTTP}:8080
    env_file:
      - ${GLOBAL_ENV_FILE:-/etc/1panel/envs/global.env}
      - ${ENV_FILE:-/etc/1panel/envs/default.env}
    volumes:
      - ${TWIKOO_ROOT_PATH}/data:/app/data
    environment:
      - TZ=Asia/Shanghai
      - TWIKOO_PORT=8080
